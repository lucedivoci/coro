<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F1EFEA">
  <title>Portale dei canti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       TAVOLOZZA — fissa
       Bianco di carta: il fondo comune a Svizzera, Ticino e Vaticano.
       Rosso: Svizzera e Ticino insieme. Oro: la nota vaticana, rara.
       Calce e granito: i muri e i sagrati di Massagno.
       ============================================================ */
    :root {
      --paper:      #F1EFEA;
      --surface:    #FFFFFF;
      --surface-2:  #FAF9F6;
      --ink:        #1C1B19;
      --ink-soft:   #55534E;
      --ink-mute:   #8A867E;
      --granito:    #5E6166;
      --rule:       #DBD8D1;
      --rule-soft:  #E8E5DE;

      --accent:      #A5252B;
      --accent-deep: #85161C;
      --accent-soft: #F7EAEA;

      --gold:      #B08B33;
      --gold-soft: #F6EEDC;
      --gold-ink:  #6E5619;

      --radius:    14px;
      --radius-sm: 9px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .icon { flex: 0 0 auto; }

    /* Le voci dei canti sono il contenuto vero: hanno il carattere del libretto */
    .serif { font-family: 'EB Garamond', Georgia, serif; }

    /* Occhielli: etichette piccole, maiuscoletto spaziato */
    .eyebrow {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ============================================================
       TESTATA
       ============================================================ */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      padding: 22px 20px;
    }
    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      height: 54px; width: 54px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid var(--rule);
      flex: 0 0 auto;
    }
    .brand { min-width: 0; flex: 1; }
    .brand-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .header-actions { display: flex; gap: 8px; flex: 0 0 auto; }

    .ghost-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--surface);
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      border-radius: 999px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .ghost-btn .label { display: none; }
    body.is-admin #adminToggleBtn { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    /* ============================================================
       NAVIGAZIONE — linguette con filo sotto, come un indice
       ============================================================ */
    .nav-wrap {
      position: sticky; top: 0; z-index: 90;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
    }
    .nav-inner {
      max-width: 1180px; margin: 0 auto;
      display: flex; gap: 4px;
      padding: 0 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 15px 14px;
      font-family: inherit;
      font-size: 0.9rem; font-weight: 600;
      color: var(--ink-mute);
      cursor: pointer; white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--accent-deep); border-bottom-color: var(--accent); }

    .view-panel { display: none; max-width: 1180px; margin: 0 auto; padding: 24px 20px 0; }
    .view-panel.active { display: block; animation: rise .28s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

    /* ============================================================
       INTESTAZIONE DELLA SCALETTA
       ============================================================ */
    .liturgy-head {
      border-left: 3px solid var(--accent);
      padding: 2px 0 2px 18px;
      margin-bottom: 26px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    }
    .liturgy-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.85rem; font-weight: 600; line-height: 1.15;
    }
    .liturgy-meta { font-size: 0.8rem; color: var(--ink-mute); }
    .liturgy-meta[hidden] { display: none; }
    .liturgy-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

    /* ============================================================
       LA SPINA — l'ordine della messa reso visibile
       ============================================================ */
    .spine { list-style: none; max-width: 780px; }
    .stop { position: relative; padding-left: 32px; }
    .stop::before {
      content: '';
      position: absolute; left: 8px; top: 24px; bottom: -6px;
      width: 1.5px; background: var(--rule);
    }
    .stop:last-child::before { display: none; }
    .stop-dot {
      position: absolute; left: 0; top: 8px;
      width: 17px; height: 17px; border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--accent);
      display: grid; place-items: center;
    }
    .stop-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    .stop-body {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 15px 18px 16px;
      margin-bottom: 14px;
    }
    .stop-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.4rem; font-weight: 600; line-height: 1.2;
      margin: 5px 0 0;
    }
    .stop-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

    /* ============================================================
       PULSANTI
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-family: inherit; font-size: 0.86rem; font-weight: 600;
      padding: 10px 15px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--rule);
      background: var(--surface-2);
      color: var(--ink);
      text-decoration: none; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-quiet { background: transparent; }
    .btn-danger { background: transparent; border-color: var(--rule); color: var(--granito); padding: 10px 12px; }
    .btn-paper { background: var(--surface); border-color: var(--rule); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn:active { transform: translateY(1px); }

    /* ============================================================
       SCHEDE (spartiti e audio)
       ============================================================ */
    .grid { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
    .card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 17px 18px 18px;
      display: flex; flex-direction: column; gap: 9px;
      height: 100%;
    }
    .card-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.3rem; font-weight: 600; line-height: 1.2;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 3px 8px;
    }
    .tag-any { color: var(--ink-mute); border-style: dashed; }
    .tag-date { border-color: var(--rule); color: var(--ink-mute); text-transform: none; letter-spacing: 0; font-weight: 500; }

    /* Segnale: questo canto è già in scaletta */
    .in-setlist {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--gold-ink);
      background: var(--gold-soft);
      border-radius: 5px; padding: 4px 9px;
      align-self: flex-start;
    }
    .in-setlist::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .card-actions .btn { flex: 1; }

    /* ============================================================
       LETTORE AUDIO
       Un solo elemento <audio> per tutta la pagina: le schede sono
       comandi che si accendono su quello. Così su iPhone non si
       esauriscono i canali audio, la riproduzione non si interrompe
       cambiando linguetta o cercando un titolo, e la barra in basso
       resta sempre a portata di pollice.
       ============================================================ */
    .player {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--rule-soft);
      border-radius: var(--radius-sm);
      padding: 9px 12px 9px 10px;
      margin: 2px 0;
    }
    .player-play {
      flex: 0 0 auto;
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%;
      background: var(--accent); color: #fff;
      cursor: pointer;
      transition: background .15s;
    }
    .player-play:active { transform: translateY(1px); }
    .player-play.loading { background: var(--ink-mute); }
    .player-play.loading .icon { animation: gira 1s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }

    .player-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }

    /* Filo di avanzamento: 4px di colore, 16px di bersaglio per il dito. */
    .track {
      position: relative;
      height: 16px; margin: -6px 0;
      cursor: pointer; touch-action: none;
    }
    .track::before {
      content: ''; position: absolute; left: 0; right: 0; top: 6px;
      height: 4px; border-radius: 999px; background: var(--rule);
    }
    .track-fill {
      position: absolute; left: 0; top: 6px;
      height: 4px; width: 0; border-radius: 999px;
      background: var(--accent);
      pointer-events: none;
    }
    .track-knob {
      position: absolute; top: 8px; left: 0;
      width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--surface);
      box-shadow: 0 1px 3px rgba(28,27,25,.28);
      opacity: 0; transition: opacity .15s;
      pointer-events: none;
    }
    .track.live .track-knob, #miniTrack .track-knob { opacity: 1; }
    .track[aria-disabled="true"] { cursor: default; }

    .player-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink-mute);
    }
    .player-meta .cur { color: var(--ink-soft); }
    .player-meta .spacer { flex: 1; }
    .player-state {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }

    /* La scheda che sta suonando si distingue senza saltare all'occhio */
    .card.is-playing { border-color: var(--accent); }
    .card.is-playing .player { background: var(--accent-soft); border-color: transparent; }

    /* ============================================================
       BARRA IN BASSO — il comando sempre presente
       ============================================================ */
    #miniPlayer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
      background: var(--surface);
      border-top: 1px solid var(--rule);
      box-shadow: 0 -6px 24px rgba(28,27,25,.09);
      padding-bottom: env(safe-area-inset-bottom);
      transform: translateY(110%);
      transition: transform .26s ease;
    }
    #miniPlayer.up { transform: none; }
    #miniPlayer[hidden] { display: none; }
    .mini-inner {
      max-width: 1180px; margin: 0 auto;
      padding: 9px 14px 11px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .mini-row { display: flex; align-items: center; gap: 10px; }
    .mini-title { flex: 1; min-width: 0; }
    .mini-title .name {
      display: block;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.06rem; font-weight: 600; line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-sub {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em;
      color: var(--ink-mute);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-btn {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px;
      border: 1px solid var(--rule); border-radius: 50%;
      background: var(--surface); color: var(--ink-soft);
      cursor: pointer;
      font-family: inherit; font-size: 0.72rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .mini-btn:active { transform: translateY(1px); }
    .mini-btn.rate { width: auto; padding: 0 12px; border-radius: 999px; }
    .mini-btn.rate.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .mini-play {
      flex: 0 0 auto;
      width: 46px; height: 46px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .mini-play.loading { background: var(--ink-mute); }
    .mini-play.loading .icon { animation: gira 1s linear infinite; }
    .mini-times {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink-mute);
      margin-top: -2px;
    }

    /* Quando la barra è alzata il contenuto non le finisce sotto */
    body.has-player { padding-bottom: calc(132px + env(safe-area-inset-bottom)); }
    body.has-player #toast { bottom: calc(142px + env(safe-area-inset-bottom)); }

    /* Ultimo ripiego: se nessun formato passa, l'anteprima di Drive
       si apre a pieno schermo, dove ha lo spazio che le serve. */
    .player-note {
      font-size: 0.78rem; color: var(--ink-mute); line-height: 1.4;
    }
    .player-note b { color: var(--accent); font-weight: 700; }

    .admin-box {
      display: none; gap: 8px;
      border-top: 1px dashed var(--rule);
      padding-top: 12px; margin-top: 2px;
    }
    .admin-box select {
      flex: 1; min-width: 0;
      font-family: inherit; font-size: 0.85rem;
      padding: 9px 10px;
      border: 1px solid var(--rule); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--ink);
    }

    /* ============================================================
       RICERCA E FILTRI
       ============================================================ */
    .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap .icon { position: absolute; left: 14px; color: var(--ink-mute); pointer-events: none; }
    .search-box {
      width: 100%;
      font-family: inherit; font-size: 0.95rem;
      padding: 13px 14px 13px 42px;
      border: 1px solid var(--rule); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink);
      outline: none;
      transition: border-color .15s;
    }
    .search-box::placeholder { color: var(--ink-mute); }
    .search-box:focus { border-color: var(--accent); }

    .filter-tags { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .filter-tags::-webkit-scrollbar { display: none; }
    .tag-btn {
      flex: 0 0 auto;
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      padding: 8px 14px;
      border: 1px solid var(--rule); border-radius: 999px;
      background: var(--surface); color: var(--ink-soft);
      cursor: pointer; white-space: nowrap;
      transition: all .15s;
    }
    .tag-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    /* ============================================================
       AVVISI
       ============================================================ */
    .update-bar {
      display: flex; align-items: center; gap: 9px;
      font-size: 0.82rem; font-weight: 600;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      max-width: 620px;
    }
    .update-bar[hidden] { display: none; }
    .update-bar.fresh { background: var(--gold-soft); color: var(--gold-ink); }
    .update-bar.old { background: transparent; border: 1px solid var(--rule-soft); color: var(--ink-mute); font-weight: 500; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center; padding: 46px 20px;
      color: var(--ink-mute);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.15rem; font-style: italic;
      line-height: 1.55;
    }

    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: inline-flex !important; }
    body.is-admin .admin-box { display: flex; }

    /* ============================================================
       OVERLAY DI DRIVE (ripiego audio)
       Gli spartiti PDF si aprono in una nuova scheda: questo
       overlay serve solo ai formati audio non riproducibili.
       ============================================================ */
    #pdfViewer { position: fixed; inset: 0; z-index: 400; background: #2A2825; display: flex; }
    #pdfViewer[hidden] { display: none; }
    .pdf-shell { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .pdf-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      background: #1C1B19; color: #F1EFEA;
      flex: 0 0 auto;
    }
    .pdf-bar-title {
      flex: 1; min-width: 0;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.1rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pdf-bar button, .pdf-bar a {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.1); color: inherit;
      border: none; border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; text-decoration: none; flex: 0 0 auto;
    }
    .pdf-bar button:disabled { opacity: .35; cursor: default; }

    /* Sotto i 520px restano solo le icone: il titolo ha bisogno di spazio. */
    @media (max-width: 520px) {
      .pdf-bar { gap: 6px; padding: 9px 10px; }
      .pdf-bar .label { display: none; }
      .pdf-bar button, .pdf-bar a { padding: 8px 10px; }
    }

    /* Contiene il messaggio con i pulsanti di ripiego. */
    #pdfStage {
      flex: 1; overflow: auto; background: #3B3833;
      padding: 14px 12px 28px;
      -webkit-overflow-scrolling: touch;
      text-align: center;
    }

    .pdf-note {
      color: #D9D5CD; font-size: 0.9rem; line-height: 1.6;
      max-width: 420px; margin: 40px auto; text-align: center;
    }
    .pdf-note strong { display: block; font-size: 1rem; margin-bottom: 8px; color: #F1EFEA; }
    .pdf-note .pdf-actions {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px;
    }
    .pdf-note .pdf-actions a {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff; text-decoration: none;
      border-radius: 9px; padding: 11px 16px;
      font-size: 0.85rem; font-weight: 600;
    }
    .pdf-note .pdf-actions a.ghost { background: rgba(255,255,255,.13); }
    #pdfFrame { flex: 1; width: 100%; border: none; background: #3B3833; }
    #pdfFrame[hidden], #pdfStage[hidden] { display: none; }
    body.viewer-open { overflow: hidden; }

    /* ============================================================
       AVVISO A COMPARSA
       ============================================================ */
    #toast {
      position: fixed; left: 50%; bottom: 22px;
      transform: translateX(-50%) translateY(200%);
      background: var(--ink); color: var(--paper);
      padding: 13px 20px; border-radius: 10px;
      font-size: 0.86rem; font-weight: 500;
      box-shadow: 0 10px 30px rgba(28,27,25,.28);
      z-index: 500; max-width: 90vw; text-align: center; white-space: pre-line;
      opacity: 0; visibility: hidden;
      transition: transform .25s ease, opacity .25s ease, visibility .25s;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
    #toast.error { background: var(--accent-deep); color: #fff; }

    /* ============================================================
       SCHERMI GRANDI
       ============================================================ */
    @media (hover: hover) {
      .card, .stop-body { transition: border-color .18s, box-shadow .18s; }
      .card:hover, .stop-body:hover { border-color: #CFCBC2; box-shadow: 0 6px 18px rgba(28,27,25,.05); }
      .btn:hover { border-color: #CBC7BE; background: var(--surface); }
      .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
      .btn-danger:hover { color: var(--accent-deep); border-color: var(--accent); }
      .tag-btn:hover { border-color: var(--ink-mute); color: var(--ink); }
      .tag-btn.active:hover { color: var(--paper); }
      .tab-btn:hover { color: var(--ink); }
      .ghost-btn:hover { border-color: var(--ink-mute); color: var(--ink); }
    }

    @media (min-width: 640px) {
      .ghost-btn .label { display: inline; }
    }

    /* Telefoni stretti: la velocità sta nella scheda, non nella barra */
    @media (max-width: 359px) {
      #miniRate { display: none; }

    @media (min-width: 760px) {

    @media (min-width: 760px) {

  </style>
</head>
<body>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  /* ==========================================================
     INCOLLA QUI L'URL DELLA WEB APP (quello che finisce con /exec)
     ========================================================== */
  const API_URL = "https://script.google.com/macros/s/AKfycby5l58Bwdcw2Ok4OnLovCqds1Iev_5bHCEA3gky6nwTtoNqwk6CvZ72JO7f_ZlZZRbr/exec";

  /* ==========================================================
     CHIAVE API DI GOOGLE DRIVE — incollala qui fra le virgolette.

     Serve per far arrivare file e registrazioni direttamente dai
     server di Google al browser, senza passare da nessuna parte.
     È la differenza fra sentire l'audio partire subito e aspettare.

     Senza chiave il sito funziona lo stesso, ma le registrazioni
     oltre i 25 MB devono passare dal server ed è più lento.

     Come ottenerla (gratuita, cinque minuti, una volta sola):
       1. console.cloud.google.com → crea un progetto
       2. API e servizi → Libreria → cerca "Google Drive API" → Abilita
       3. API e servizi → Credenziali → Crea credenziali → Chiave API
       4. Limita la chiave: applicazioni web (referrer HTTP) → il
          dominio del sito;  restrizioni API → solo Google Drive API
     Così limitata la chiave può leggere soltanto i file già pubblici,
     e solo dal tuo sito: non c'è nulla da nascondere.
     ========================================================== */
  const DRIVE_API_KEY = "";
  /* ========================================================== */

  /** Indirizzo diretto al contenuto del file, disponibile solo con la chiave. */
  function driveApiUrl(id) {
    return (DRIVE_API_KEY && id)
      ? 'https://www.googleapis.com/drive/v3/files/' + id + '?alt=media&key=' + DRIVE_API_KEY
      : '';
  }

  const AUDIO_TAGS = ["Tutti", "Messa", "Prove", "Audio_guida"];
  const GIORNI_NOVITA = 14;

  let appData = { songs: [], audios: [], setlist: [], momenti: [], liturgyTitle: "", choirName: "", logoUrl: "" };
  let activeTag = "Tutti";
  let activeAudioTag = "Tutti";
  let adminToken = sessionStorage.getItem('coroAdminPwd') || "";
  let inSetlist = new Map();   // id del file -> momento

  /* ---------- Icone ----------
     Disegnate a mano invece che con le emoji, che cambiano
     aspetto su ogni sistema operativo. */
  const ICONS = {
    scaletta: '<path d="M4 6h1.5M4 12h1.5M4 18h1.5M9 6h11M9 12h11M9 18h11"/>',
    spartiti: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M10.5 17.2a1.6 1.6 0 1 0 3.2 0V11l2.3-.8"/>',
    audio:    '<path d="M4 10.5v3M8 7.5v9M12 4.5v15M16 8.5v7M20 11v2"/>',
    apri:     '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9.5 13h5M9.5 17h3.5"/>',
    scarica:  '<path d="M12 4v11"/><path d="m7.6 10.6 4.4 4.4 4.4-4.4"/><path d="M5 19.5h14"/>',
    chiudi:   '<path d="m6 6 12 12M18 6 6 18"/>',
    sync:     '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3.5v5h-5"/>',
    chiave:   '<circle cx="8.5" cy="14.5" r="3.8"/><path d="m11.4 11.6 7.6-7.6M16.8 6.2l2 2M14.8 8.2l2 2"/>',
    cerca:    '<circle cx="11" cy="11" r="6.2"/><path d="m20 20-4.6-4.6"/>',
    pdf:      '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M12 10.5v6"/><path d="m9.6 14.1 2.4 2.4 2.4-2.4"/>',
    piu:      '<path d="M12 5.5v13M5.5 12h13"/>',
    esterno:  '<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"/>',
    rimuovi:  '<path d="m7 7 10 10M17 7 7 17"/>',
    stella:   '<path d="M12 4.5 13.7 10l5.3 1.8-5.3 1.8L12 19.5l-1.7-5.9L5 11.8 10.3 10z"/>',
    play:     '<path d="M9 6.2 18.2 12 9 17.8z" fill="currentColor"/>',
    pausa:    '<path d="M9.5 6.2v11.6M14.5 6.2v11.6" stroke-width="2.1"/>',
    attesa:   '<path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5" opacity=".9"/>',
    indietro15: '<path d="M11 5.5A7.4 7.4 0 1 1 4.2 10"/><path d="M4 3.4v4.2h4.2"/>' +
                '<text x="12" y="15.4" text-anchor="middle" font-size="7.6" font-weight="700" ' +
                'font-family="Archivo,sans-serif" fill="currentColor" stroke="none">15</text>',
    avanti15:   '<path d="M13 5.5A7.4 7.4 0 1 0 19.8 10"/><path d="M20 3.4v4.2h-4.2"/>' +
                '<text x="12" y="15.4" text-anchor="middle" font-size="7.6" font-weight="700" ' +
                'font-family="Archivo,sans-serif" fill="currentColor" stroke="none">15</text>'
  };
  function icon(name, size) {
    return '<svg class="icon" width="' + (size || 19) + '" height="' + (size || 19) + '" viewBox="0 0 24 24" ' +
      'fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }
  function paintIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(el => {
      el.outerHTML = icon(el.dataset.icon, el.dataset.size);
    });
  }

  /* ---------- API ----------
     Chiamata anonima: senza cookie il bug multi-account non si presenta. */
  async function api(action, params = {}) {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    const res = await fetch(url.toString(), {
      method: 'GET', redirect: 'follow', credentials: 'omit', cache: 'no-store'
    });
    if (!res.ok) throw new Error('Il server ha risposto ' + res.status);
    return res.json();
  }

  /* ---------- Utilità ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  let toastTimer;
  function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3600);
  }

  function setAdmin(on) {
    document.body.classList.toggle('is-admin', on);
    const btn = document.getElementById('adminToggleBtn');
    btn.innerHTML = icon('chiave') + '<span class="label">' + (on ? 'Esci' : 'Admin') + '</span>';
  }

  /* ---------- Caricamento ---------- */
  async function loadData() {
    try {
      const res = await api('data');
      if (!res.success) throw new Error(res.msg || 'Risposta non valida');
      renderApp(res.data);
    } catch (err) {
      document.getElementById('setlistBody').innerHTML =
        '<li class="empty-state">Non riesco a contattare il server.<br>Controlla la connessione e ricarica la pagina.</li>';
      toast('Connessione non riuscita: ' + err.message, 'error');
    }
  }

  function renderApp(data) {
    appData = data;
    document.getElementById('mainTitle').textContent = data.choirName;

    const logo = document.getElementById('mainLogo');
    if (data.logoUrl) { logo.src = data.logoUrl; logo.style.display = 'block'; }
    else { logo.style.display = 'none'; }

    document.getElementById('liturgyTitle').textContent = data.liturgyTitle;

    inSetlist = new Map(data.setlist.filter(i => i.fileId).map(i => [i.fileId, i.momento]));

    const upd = data.updates || {};
    renderSetlistUpdate(upd.setlist);
    renderUpdateBar('songsUpdate', upd.songs, 'nuovo spartito', 'nuovi spartiti');
    renderUpdateBar('audiosUpdate', upd.audios, 'nuova registrazione', 'nuove registrazioni');

    renderSetlist();
    renderTagFilters();
    applyFilters();
    applyAudioFilters();
  }

  /* ---------- Avvisi di aggiornamento ---------- */
  function parseStamp(s) {
    const m = String(s || '').match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
    if (!m) return 0;
    let y = +m[3]; if (y < 100) y += 2000;
    return new Date(y, +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
  }
  function quando(ts, testo) {
    if (!ts) return testo;
    const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    const quel = new Date(ts); quel.setHours(0, 0, 0, 0);
    const g = Math.round((oggi - quel) / 86400000);
    if (g <= 0) return 'oggi';
    if (g === 1) return 'ieri';
    if (g < 7) return g + ' giorni fa';
    return 'il ' + String(testo).split(' ')[0];
  }
  function giorniDa(ts) { return ts ? (Date.now() - ts) / 86400000 : 9999; }

  function renderUpdateBar(elId, info, singolare, plurale) {
    const el = document.getElementById(elId);
    const ts = parseStamp(info && info.date);
    if (!ts) { el.hidden = true; return; }
    const n = info.count || 0;
    if (giorniDa(ts) <= GIORNI_NOVITA && n > 0) {
      el.className = 'update-bar fresh';
      el.innerHTML = icon('stella', 17) + '<span>' + n + ' ' + (n === 1 ? singolare : plurale) +
                     ' ' + esc(quando(ts, info.date)) + '</span>';
    } else {
      el.className = 'update-bar old';
      el.innerHTML = '<span>Ultimo aggiornamento dell\'archivio: ' + esc(info.date) + '</span>';
    }
    el.hidden = false;
  }

  function renderSetlistUpdate(info) {
    const el = document.getElementById('setlistUpdate');
    const ts = parseStamp(info && info.date);
    if (!ts) { el.hidden = true; return; }
    el.textContent = 'Aggiornata ' + quando(ts, info.date);
    el.hidden = false;
  }

  /* ---------- Scaletta ---------- */
  function renderSetlist() {
    const body = document.getElementById('setlistBody');
    body.innerHTML = '';
    document.getElementById('downloadSetlistBtn').hidden = !appData.setlist.length;

    if (!appData.setlist.length) {
      body.innerHTML = '<li class="empty-state">Nessun canto in scaletta.<br>Verrà preparata prima della celebrazione.</li>';
      return;
    }

    appData.setlist.forEach(item => {
      const li = document.createElement('li');
      li.className = 'stop';
      li.innerHTML =
        '<span class="stop-dot"></span>' +
        '<div class="stop-body">' +
          '<span class="eyebrow">' + esc(item.momento) + '</span>' +
          '<h3 class="stop-title">' + esc(item.title) + '</h3>' +
          '<div class="stop-actions">' +
            '<a href="' + esc(item.viewUrl || item.downloadUrl) + '" target="_blank" rel="noopener" class="btn">' +
              icon('apri') + 'Apri spartito</a>' +
            '<a href="' + esc(item.downloadUrl) + '" target="_blank" rel="noopener" class="btn btn-primary">' +
              icon('scarica') + 'Salva</a>' +
            '<button class="btn btn-danger admin-only js-remove" aria-label="Rimuovi">' + icon('rimuovi') + '</button>' +
          '</div>' +
        '</div>';
      li.querySelector('.js-remove').addEventListener('click', () => removeSong(item.momento));
      body.appendChild(li);
    });
  }

  /* ---------- Spartiti ---------- */
  function renderTagFilters() {
    const box = document.getElementById('tagFilters');
    box.innerHTML = '';
    ['Tutti'].concat(appData.momenti).forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'tag-btn' + (activeTag === m ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', () => {
        activeTag = m;
        box.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
      });
      box.appendChild(btn);
    });
  }

  function momentoTags(tags) {
    const veri = tags.filter(t => t && t.toLowerCase() !== 'tutti');
    if (veri.length) return veri.map(t => '<span class="tag">' + esc(t) + '</span>').join('');
    return '<span class="tag tag-any">Ogni momento</span>';
  }

  function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const container = document.getElementById('songsList');
    container.innerHTML = '';

    // La ricerca guarda titolo e momenti insieme
    const filtered = appData.songs.filter(s => {
      const testo = (s.title + ' ' + s.tags.join(' ')).toLowerCase();
      const okQuery = !q || testo.includes(q);
      const okTag = activeTag === 'Tutti' || s.tags.includes(activeTag) || s.tags.includes('Tutti');
      return okQuery && okTag;
    });

    if (!filtered.length) {
      container.innerHTML = '<div class="empty-state">Nessun canto trovato.</div>';
      return;
    }

    const optionsHtml = appData.momenti
      .map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');

    filtered.forEach(s => {
      const momento = inSetlist.get(s.id);
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML =
        (momento ? '<span class="in-setlist">In scaletta · ' + esc(momento) + '</span>' : '') +
        '<h3 class="card-title">' + esc(s.title) + '</h3>' +
        '<div class="tags">' + momentoTags(s.tags) + '</div>' +
        '<div class="card-actions">' +
          '<a href="' + esc(s.viewUrl || s.downloadUrl) + '" target="_blank" rel="noopener" class="btn">' +
            icon('apri') + 'Apri</a>' +
          '<a href="' + esc(s.downloadUrl) + '" target="_blank" rel="noopener" class="btn btn-primary">' +
            icon('scarica') + 'Salva</a>' +
        '</div>' +
        '<div class="admin-box">' +
          '<select class="js-momento">' + optionsHtml + '</select>' +
          '<button class="btn js-add">' + icon('piu') + 'Aggiungi</button>' +
        '</div>';
      card.querySelector('.js-add').addEventListener('click',
        () => addToSetlist(s.id, card.querySelector('.js-momento').value));
      container.appendChild(card);
    });
  }

  /* ---------- Audio ---------- */
  function renderAudioTagFilters() {
    const box = document.getElementById('audioTagFilters');
    box.innerHTML = '';
    AUDIO_TAGS.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'tag-btn' + (activeAudioTag === t ? ' active' : '');
      btn.textContent = t.replace('_', ' ');
      btn.addEventListener('click', () => {
        activeAudioTag = t;
        box.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyAudioFilters();
      });
      box.appendChild(btn);
    });
  }

  /* ---------- Lettore audio ----------
     Un solo elemento <audio> serve tutta la pagina. Le schede sono
     comandi: accendono quello. Tre conseguenze pratiche.
     1) Su iPhone Safari sblocca l'audio al primo tocco e da quel
        momento l'elemento resta sbloccato: possiamo cambiare brano
        e sorgente senza che il sistema ci fermi.
     2) La riproduzione non si interrompe più quando cerchi un titolo,
        cambi filtro o passi alla scaletta.
     3) Niente venti elementi audio che chiedono i metadati a Drive
        tutti insieme.

     Sulle sorgenti: l'indirizzo di Drive che usavamo risponde alle
     richieste parziali in modo incostante, e iOS pretende quelle:
     se non le ottiene abbandona il file. Per questo qui proviamo
     più indirizzi in fila, poi il download completo in memoria, e
     solo alla fine l'anteprima di Drive — a pieno schermo, dove ci sta. */

  const RATES = [1, 1.25, 1.5, 0.75];
  const SALTO = 15;                      // secondi dei tasti avanti/indietro
  const SILENZIO = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

  const suono = new Audio();
  suono.preload = 'metadata';
  suono.playsInline = true;
  suono.setAttribute('playsinline', '');

  let coda = [];            // le registrazioni attualmente a video, in ordine
  let corrente = null;      // la registrazione in ascolto
  let fonti = [];           // indirizzi da provare per la registrazione corrente
  let fonteIdx = 0;
  let sbloccato = false;
  let rateIdx = 0;
  let cercando = false;
  const durate = new Map(); // id -> secondi, riempita pian piano

  function fmtTime(s) {
    if (!isFinite(s) || s < 0) return '–:––';
    const m = Math.floor(s / 60);
    return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  /* --- Sorgenti da provare, dalla più diretta alla più tollerante ---
     L'API di Drive va per prima perché è l'unica che dichiara il tipo
     giusto (audio/mpeg e non "octet-stream", che Safari rifiuta) e che
     accetta le richieste parziali, indispensabili su iPhone.
     Gli indirizzi di drive.usercontent restano come ripiego: spesso
     rispondono con una pagina HTML, che il lettore non sa suonare. */
  function fontiPer(item) {
    const l = [];
    if (item.id) {
      const api = driveApiUrl(item.id);
      if (api) l.push(api);
      l.push('https://drive.usercontent.google.com/download?id=' + item.id + '&export=download&confirm=t');
    }
    if (item.streamUrl) l.push(item.streamUrl);
    if (item.id) {
      l.push('https://drive.usercontent.google.com/download?id=' + item.id + '&export=download');
      l.push('https://lh3.googleusercontent.com/d/' + item.id);
      l.push('https://drive.google.com/uc?export=download&id=' + item.id);
    }
    if (item.downloadUrl) l.push(item.downloadUrl);
    return l.filter((v, i) => v && l.indexOf(v) === i);
  }

  /* Il primo tocco dell'utente sblocca l'elemento audio: da lì in poi
     possiamo cambiare sorgente anche dopo un'attesa di rete. */
  function sblocca() {
    if (sbloccato) return;
    sbloccato = true;
    const src = suono.src;
    try {
      suono.src = SILENZIO;
      const p = suono.play();
      if (p && p.then) p.then(() => { suono.pause(); if (src) suono.src = src; })
                       .catch(() => { if (src) suono.src = src; });
    } catch (e) {}
  }

  /* Un indirizzo morto a volte non dà errore: resta semplicemente muto.
     Dopo sette secondi senza un byte utile passo al successivo, invece
     di lasciare la rotellina che gira all'infinito. */
  let sorveglia = null;
  function fermaSorveglianza() { clearTimeout(sorveglia); sorveglia = null; }

  function avvia(url) {
    fermaSorveglianza();
    suono.src = url;
    try { suono.load(); } catch (e) {}
    suono.playbackRate = RATES[rateIdx];

    sorveglia = setTimeout(() => {
      if (suono.readyState < 2) prossimaFonte();
    }, 7000);

    const p = suono.play();
    if (p && p.catch) p.catch(err => {
      // NotAllowedError = manca il gesto dell'utente: non è colpa del file.
      if (err && err.name === 'NotAllowedError') { fermaSorveglianza(); attesa(false); disegna(); return; }
      prossimaFonte();
    });
  }

  function prossimaFonte() {
    fermaSorveglianza();
    // Se a fallire è il file già in memoria, non c'è altro da tentare:
    // riprovare gli indirizzi di Drive porterebbe solo a un giro infinito.
    if (suono.src && suono.src.indexOf('blob:') === 0) {
      if (corrente) arrenditi(corrente, 'registrazione non leggibile');
      return;
    }
    fonteIdx++;
    if (fonteIdx < fonti.length) { avvia(fonti[fonteIdx]); return; }
    scaricaInMemoria();
  }

  /* ==========================================================
     QUANDO DRIVE NON STREAMMA

     Gli indirizzi diretti di Drive funzionano solo se il file è
     pubblico e il browser non ha più account Google collegati.
     Altrimenti Drive risponde con una pagina di accesso al posto
     dell'audio: l'elemento <audio> la riceve, non riconosce nulla
     e dichiara il formato non supportato.

     Il ripiego passa dal server, come per gli spartiti: chiedo la
     registrazione a fette da 3 MB, le ricompongo in memoria e la
     suono da lì. Un blob locale risponde sempre, anche allo
     spostamento sulla barra del tempo.
     ========================================================== */
  const CHUNK       = 3 * 1024 * 1024;     // deve combaciare col server
  const AUDIO_CACHE = new Map();           // id -> indirizzo del blob
  const CACHE_MAX   = 3;                   // tre registrazioni in memoria bastano

  let scaricoToken = 0;
  // Una volta appurato che gli indirizzi diretti non reggono, smetto di
  // provarli: in una parrocchia la configurazione di Drive non cambia
  // a metà pomeriggio, e ogni tentativo a vuoto è attesa inutile.
  let soloServer = !DRIVE_API_KEY && sessionStorage.getItem('coroSoloServer') === '1';

  function ricordaBlob(id, url) {
    if (AUDIO_CACHE.size >= CACHE_MAX) {
      const vecchio = AUDIO_CACHE.keys().next().value;
      URL.revokeObjectURL(AUDIO_CACHE.get(vecchio));
      AUDIO_CACHE.delete(vecchio);
    }
    AUDIO_CACHE.set(id, url);
  }

  /* Mostra l'avanzamento al posto del sottotitolo della barra. */
  function avanzamento(testo) {
    const el = document.getElementById('miniSub');
    if (el) el.textContent = testo;
  }

  async function scaricaDalServer(item) {
    const token = ++scaricoToken;
    const pezzi = [];
    let letti = 0, totale = 0, tipo = 'audio/mpeg';

    avanzamento('Preparo la registrazione…');

    while (totale === 0 || letti < totale) {
      const res = await api('chunk', { id: item.id, start: letti, len: CHUNK });
      if (token !== scaricoToken) return null;         // l'utente è passato ad altro
      if (!res || !res.success) throw new Error((res && res.msg) || 'file non disponibile');

      if (!totale) { totale = res.total; tipo = res.type || tipo; }

      const bin = atob(res.b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      if (!arr.length) break;

      pezzi.push(arr);
      letti += arr.length;
      avanzamento('Scarico… ' + Math.round(letti / totale * 100) + '%');
    }

    if (token !== scaricoToken) return null;
    return URL.createObjectURL(new Blob(pezzi, { type: tipo }));
  }

  /* Il ripiego completo: prima un tentativo diretto (se il file è
     pubblico è la strada più veloce e permette il vero streaming),
     poi il server. */
  async function scaricaInMemoria() {
    const item = corrente;
    attesa(true);

    if (!soloServer) {
      for (const url of fonti) {
        try {
          const r = await fetch(url, { credentials: 'omit', cache: 'default' });
          if (!r.ok) continue;
          const b = await r.blob();
          if (b.size < 2048) continue;                  // pagina di errore, non audio
          if (!corrente || corrente.id !== item.id) return;
          const u = URL.createObjectURL(b);
          ricordaBlob(item.id, u);
          avviaBlob(u);
          return;
        } catch (e) { /* quasi sempre CORS: si passa oltre */ }
      }
    }

    try {
      const url = await scaricaDalServer(item);
      if (!url) return;                                 // richiesta superata da un'altra
      if (!corrente || corrente.id !== item.id) { URL.revokeObjectURL(url); return; }

      soloServer = true;
      sessionStorage.setItem('coroSoloServer', '1');
      ricordaBlob(item.id, url);
      aggiornaBarra();
      avviaBlob(url);
    } catch (err) {
      if (!corrente || corrente.id !== item.id) return;
      aggiornaBarra();
      arrenditi(item, err.message);
    }
  }

  function avviaBlob(url) {
    fermaSorveglianza();
    fonti = [url]; fonteIdx = 0;      // niente più tentativi a catena
    suono.src = url;
    try { suono.load(); } catch (e) {}
    suono.playbackRate = RATES[rateIdx];
    const p = suono.play();
    if (p && p.catch) p.catch(() => { attesa(false); disegna(); });
  }

  function arrenditi(item, motivo) {
    attesa(false);
    toast(motivo ? 'Non riesco a riprodurla (' + motivo + '): uso il lettore di Drive.'
                 : 'Questo formato non si apre nel browser: uso il lettore di Drive.');
    apriDrive(item);
    chiudiBarra();
  }

  /* --- Comandi --- */
  function suonaItem(item) {
    sblocca();
    if (corrente && corrente.id === item.id) { alterna(); return; }
    scaricoToken++;                    // ferma un eventuale scarico in corso
    corrente = item;
    fonti = fontiPer(item);
    fonteIdx = 0;
    apriBarra();
    attesa(true);
    aggiornaBarra();
    disegna();
    mediaSession();

    const pronta = AUDIO_CACHE.get(item.id);
    if (pronta) { avviaBlob(pronta); return; }   // già in memoria: parte subito
    if (soloServer) { scaricaInMemoria(); return; }
    avvia(fonti[0]);
  }

  function alterna() {
    if (!corrente) return;
    sblocca();
    if (suono.paused) {
      const p = suono.play();
      if (p && p.catch) p.catch(() => prossimaFonte());
    } else {
      suono.pause();
    }
  }

  function salta(delta) {
    if (!isFinite(suono.duration)) return;
    suono.currentTime = Math.max(0, Math.min(suono.duration - 0.3, suono.currentTime + delta));
  }

  function scorri(passo) {
    if (!corrente || !coda.length) return;
    const i = coda.findIndex(a => a.id === corrente.id);
    const next = coda[(i + passo + coda.length) % coda.length];
    if (next) suonaItem(next);
  }

  function chiudiBarra() {
    fermaSorveglianza();
    try { suono.pause(); } catch (e) {}
    suono.removeAttribute('src');
    try { suono.load(); } catch (e) {}
    scaricoToken++;                    // niente scarichi orfani
    corrente = null;
    document.getElementById('miniPlayer').classList.remove('up');
    document.body.classList.remove('has-player');
    setTimeout(() => { if (!corrente) document.getElementById('miniPlayer').hidden = true; }, 280);
    disegna();
  }

  function apriBarra() {
    const bar = document.getElementById('miniPlayer');
    bar.hidden = false;
    document.body.classList.add('has-player');
    requestAnimationFrame(() => bar.classList.add('up'));
  }

  /* --- Disegno --- */
  function attesa(on) {
    document.getElementById('miniPlayBtn').classList.toggle('loading', !!on);
    document.querySelectorAll('.card.is-playing .player-play')
      .forEach(b => b.classList.toggle('loading', !!on));
    if (on) {
      document.getElementById('miniPlayBtn').innerHTML = icon('attesa', 24);
      document.querySelectorAll('.card.is-playing .player-play')
        .forEach(b => b.innerHTML = icon('attesa', 21));
    }
  }

  function simbolo() { return suono.paused ? 'play' : 'pausa'; }

  function disegna() {
    const btn = document.getElementById('miniPlayBtn');
    if (!btn.classList.contains('loading')) {
      btn.innerHTML = icon(simbolo(), 24);
      btn.setAttribute('aria-label', suono.paused ? 'Riproduci' : 'Metti in pausa');
    }
    document.querySelectorAll('#audioList .card').forEach(card => {
      const attiva = corrente && card.dataset.id === corrente.id;
      card.classList.toggle('is-playing', !!attiva);
      const b = card.querySelector('.player-play');
      if (!b) return;
      if (attiva && b.classList.contains('loading')) return;
      b.classList.remove('loading');
      b.innerHTML = icon(attiva ? simbolo() : 'play', 21);
      b.setAttribute('aria-label', attiva && !suono.paused ? 'Metti in pausa' : 'Riproduci');
      const st = card.querySelector('.player-state');
      if (st) st.textContent = attiva ? (suono.paused ? 'In pausa' : 'In ascolto') : '';
      const tr = card.querySelector('.track');
      if (tr) tr.classList.toggle('live', !!attiva);
    });
  }

  function aggiornaBarra() {
    if (!corrente) return;
    document.getElementById('miniTitle').textContent = corrente.title;
    const parti = [corrente.tags.join(', ') || 'Audio'];
    if (corrente.recordDate) parti.push(corrente.recordDate);
    document.getElementById('miniSub').textContent = parti.join(' · ');
  }

  function posiziona(frazione) {
    const f = Math.max(0, Math.min(1, frazione || 0));
    const pct = (f * 100) + '%';
    const fill = document.getElementById('miniFill');
    const knob = document.getElementById('miniKnob');
    fill.style.width = pct;
    knob.style.left = pct;
    document.getElementById('miniTrack').setAttribute('aria-valuenow', Math.round(f * 100));
    if (corrente) {
      const card = document.querySelector('#audioList .card[data-id="' + cssId(corrente.id) + '"]');
      if (card) {
        const cf = card.querySelector('.track-fill');
        const ck = card.querySelector('.track-knob');
        if (cf) cf.style.width = pct;
        if (ck) ck.style.left = pct;
      }
    }
  }

  function cssId(id) { return String(id).replace(/"/g, '\\"'); }

  function tempi() {
    const d = isFinite(suono.duration) ? suono.duration : NaN;
    document.getElementById('miniCur').textContent = fmtTime(suono.currentTime);
    document.getElementById('miniTot').textContent = fmtTime(d);
    if (corrente) {
      if (isFinite(d)) durate.set(corrente.id, d);
      const card = document.querySelector('#audioList .card[data-id="' + cssId(corrente.id) + '"]');
      if (card) {
        const c = card.querySelector('.cur'), t = card.querySelector('.tot');
        if (c) c.textContent = fmtTime(suono.currentTime);
        if (t) t.textContent = fmtTime(d);
      }
    }
  }

  /* --- Trascinamento della barra: funziona a dito e a mouse --- */
  function collegaTrack(el, attivo) {
    let trascino = false;
    function frazione(e) {
      const r = el.getBoundingClientRect();
      return r.width ? (e.clientX - r.left) / r.width : 0;
    }
    el.addEventListener('pointerdown', e => {
      if (!attivo()) return;
      if (!isFinite(suono.duration)) return;
      trascino = true; cercando = true;
      el.setPointerCapture(e.pointerId);
      const f = frazione(e);
      posiziona(f);
      document.getElementById('miniCur').textContent = fmtTime(f * suono.duration);
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!trascino) return;
      const f = frazione(e);
      posiziona(f);
      document.getElementById('miniCur').textContent = fmtTime(f * suono.duration);
    });
    const chiudi = e => {
      if (!trascino) return;
      trascino = false; cercando = false;
      const f = frazione(e);
      if (isFinite(suono.duration)) suono.currentTime = f * suono.duration;
    };
    el.addEventListener('pointerup', chiudi);
    el.addEventListener('pointercancel', () => { trascino = false; cercando = false; });
    el.addEventListener('keydown', e => {
      if (!attivo() || !isFinite(suono.duration)) return;
      if (e.key === 'ArrowRight') { salta(5); e.preventDefault(); }
      if (e.key === 'ArrowLeft')  { salta(-5); e.preventDefault(); }
    });
  }

  collegaTrack(document.getElementById('miniTrack'), () => !!corrente);

  /* --- Ascolto dell'elemento audio --- */
  suono.addEventListener('loadedmetadata', () => { fermaSorveglianza(); attesa(false); tempi(); disegna(); });
  suono.addEventListener('durationchange', tempi);
  suono.addEventListener('timeupdate', () => {
    if (cercando) return;
    tempi();
    if (isFinite(suono.duration) && suono.duration > 0) posiziona(suono.currentTime / suono.duration);
  });
  suono.addEventListener('progress', () => { if (suono.readyState >= 2) attesa(false); });
  suono.addEventListener('waiting', () => attesa(true));
  suono.addEventListener('playing', () => { fermaSorveglianza(); attesa(false); disegna(); });
  suono.addEventListener('play', () => { attesa(false); disegna(); mediaSession(); });
  suono.addEventListener('pause', () => { attesa(false); disegna(); });
  suono.addEventListener('ended', () => {
    posiziona(0);
    const i = coda.findIndex(a => corrente && a.id === corrente.id);
    if (i > -1 && i < coda.length - 1) suonaItem(coda[i + 1]);   // avanti da solo
    else disegna();
  });
  suono.addEventListener('error', () => {
    if (!corrente) return;
    if (suono.src && suono.src.indexOf('data:audio') === 0) return;   // il silenzio di sblocco
    prossimaFonte();
  });

  /* --- Comandi del telefono: schermata di blocco, cuffie, auto --- */
  function mediaSession() {
    if (!('mediaSession' in navigator) || !corrente) return;
    try {
      const art = [];
      if (appData.logoUrl) art.push({ src: appData.logoUrl, sizes: '512x512' });
      navigator.mediaSession.metadata = new MediaMetadata({
        title: corrente.title,
        artist: appData.choirName || 'Coro',
        album: corrente.recordDate || '',
        artwork: art
      });
      const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
      set('play', () => alterna());
      set('pause', () => alterna());
      set('previoustrack', () => scorri(-1));
      set('nexttrack', () => scorri(1));
      set('seekbackward', () => salta(-SALTO));
      set('seekforward', () => salta(SALTO));
      set('seekto', d => { if (d && d.seekTime != null) suono.currentTime = d.seekTime; });
    } catch (e) {}
  }

  /* --- Durate mostrate prima dell'ascolto ---
     Le chiediamo una alla volta e solo per le schede che stanno per
     entrare nello schermo. Se Drive non risponde, la scheda resta
     senza durata: nessun errore, nessuna cascata di tentativi. */
  const codaDurate = [];
  let sondaAttiva = false;

  function chiediDurata(item) {
    // Se gli indirizzi diretti non rispondono, la sonda fallirebbe sempre:
    // la durata comparirà dopo il primo ascolto, senza sprecare tentativi.
    if (soloServer) return;
    if (durate.has(item.id) || codaDurate.some(x => x.id === item.id)) return;
    codaDurate.push(item);
    lavoraDurate();
  }
  function lavoraDurate() {
    if (sondaAttiva || !codaDurate.length) return;
    const item = codaDurate.shift();
    sondaAttiva = true;
    const sonda = new Audio();
    sonda.preload = 'metadata';
    let chiuso = false;
    const fine = () => {
      if (chiuso) return;
      chiuso = true;
      clearTimeout(timer);
      try { sonda.removeAttribute('src'); sonda.load(); } catch (e) {}
      sondaAttiva = false;
      setTimeout(lavoraDurate, 60);
    };
    const timer = setTimeout(fine, 9000);
    sonda.addEventListener('loadedmetadata', () => {
      if (isFinite(sonda.duration) && sonda.duration > 0) {
        durate.set(item.id, sonda.duration);
        document.querySelectorAll('#audioList .card[data-id="' + cssId(item.id) + '"] .tot')
          .forEach(el => { if (!corrente || corrente.id !== item.id) el.textContent = fmtTime(sonda.duration); });
      }
      fine();
    });
    sonda.addEventListener('error', fine);
    sonda.src = fontiPer(item)[0];
  }

  const occhio = ('IntersectionObserver' in window)
    ? new IntersectionObserver((voci, obs) => {
        voci.forEach(v => {
          if (!v.isIntersecting) return;
          obs.unobserve(v.target);
          if (v.target.__item) chiediDurata(v.target.__item);
        });
      }, { rootMargin: '300px 0px' })
    : null;

  /* --- La scheda --- */
  function buildPlayer(item) {
    const wrap = document.createElement('div');
    wrap.className = 'player';
    const nota = durate.has(item.id) ? fmtTime(durate.get(item.id)) : '–:––';
    wrap.innerHTML =
      '<button class="player-play" type="button" aria-label="Riproduci">' + icon('play', 21) + '</button>' +
      '<div class="player-body">' +
        '<div class="track" aria-hidden="true"><div class="track-fill"></div><div class="track-knob"></div></div>' +
        '<div class="player-meta">' +
          '<span class="cur">0:00</span><span>/</span><span class="tot">' + nota + '</span>' +
          '<span class="spacer"></span>' +
          '<span class="player-state"></span>' +
        '</div>' +
      '</div>';

    wrap.querySelector('.player-play').addEventListener('click', () => suonaItem(item));
    collegaTrack(wrap.querySelector('.track'), () => !!corrente && corrente.id === item.id);
    return wrap;
  }

  function applyAudioFilters() {
    const q = document.getElementById('searchAudioInput').value.toLowerCase().trim();
    const container = document.getElementById('audioList');
    container.innerHTML = '';

    const filtered = appData.audios.filter(a => {
      const testo = (a.title + ' ' + a.tags.join(' ') + ' ' + a.recordDate).toLowerCase();
      const okQuery = !q || testo.includes(q);
      const okTag = activeAudioTag === 'Tutti' || a.tags.includes(activeAudioTag);
      return okQuery && okTag;
    });

    coda = filtered;   // i tasti avanti/indietro seguono ciò che vedi

    if (!filtered.length) {
      container.innerHTML = '<div class="empty-state">Nessuna registrazione trovata.</div>';
      return;
    }

    filtered.forEach(a => {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.id = a.id;
      card.__item = a;
      card.innerHTML =
        '<h3 class="card-title">' + esc(a.title) + '</h3>' +
        '<div class="tags">' +
          '<span class="tag">' + esc(a.tags.join(', ') || 'Audio') + '</span>' +
          (a.recordDate ? '<span class="tag tag-date">' + esc(a.recordDate) + '</span>' : '') +
        '</div>' +
        '<div class="card-actions">' +
          '<a href="' + esc(a.downloadUrl) + '" target="_blank" rel="noopener" class="btn">' +
            icon('scarica') + 'Scarica</a>' +
        '</div>';
      card.insertBefore(buildPlayer(a), card.querySelector('.card-actions'));
      container.appendChild(card);
      if (occhio) occhio.observe(card); else chiediDurata(a);
    });

    disegna();
    if (corrente && isFinite(suono.duration) && suono.duration > 0) {
      posiziona(suono.currentTime / suono.duration);
      tempi();
    }
  }

  /* --- I tasti della barra --- */
  document.getElementById('miniPlayBtn').addEventListener('click', alterna);
  document.getElementById('miniBack').addEventListener('click', () => salta(-SALTO));
  document.getElementById('miniFwd').addEventListener('click', () => salta(SALTO));
  document.getElementById('miniClose').addEventListener('click', chiudiBarra);
  document.getElementById('miniRate').addEventListener('click', () => {
    rateIdx = (rateIdx + 1) % RATES.length;
    const r = RATES[rateIdx];
    suono.playbackRate = r;
    const b = document.getElementById('miniRate');
    b.textContent = String(r).replace('.', ',') + '×';
    b.classList.toggle('on', r !== 1);
  });
  document.getElementById('miniBack').innerHTML = icon('indietro15', 20);
  document.getElementById('miniFwd').innerHTML = icon('avanti15', 20);
  document.getElementById('miniClose').innerHTML = icon('chiudi', 18);
  document.getElementById('miniPlayBtn').innerHTML = icon('play', 24);

  /* Barra spaziatrice: mette in pausa, purché non si stia scrivendo */
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || !corrente) return;
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    e.preventDefault();
    alterna();
  });

  /* ---------- Ripiego: l'anteprima di Drive a pieno schermo ----------
     Serve solo per i formati audio che il browser non sa aprire (per
     esempio un .ogg su iPhone). Qui l'iframe di Drive resta l'unica
     strada: se il telefono lo rifiuta, il pulsante «Apri in Drive»
     nel riquadro porta comunque al file. */
  function apriDrive(item) {
    if (!item || !item.id) return;
    prontoPerAprire(item.title, item.downloadUrl || '#');

    const stage = document.getElementById('pdfStage');
    stage.hidden = false;
    stage.style.flex = '0 0 auto';     // il posto va all'iframe, non al messaggio
    stage.innerHTML = notaHtml(
      'Riproduzione tramite Drive',
      'Questo formato non si apre direttamente nel browser. Se il riquadro qui sotto resta nero, apri il file in Drive.',
      item.id, item.downloadUrl);

    const frame = document.getElementById('pdfFrame');
    frame.hidden = false;
    frame.src = 'https://drive.google.com/file/d/' + item.id + '/preview';

    document.getElementById('pdfViewer').hidden = false;
    document.body.classList.add('viewer-open');
  }

  /* ==========================================================
     OVERLAY DI DRIVE (solo ripiego audio)

     Gli spartiti PDF non passano più di qui: il pulsante «Apri»
     è un semplice link che apre il viewer di Drive in una nuova
     scheda. Il file arriva in streaming dai server di Google,
     senza transitare dal server della webapp: apertura immediata
     su telefono, tablet e computer.

     Questo overlay resta soltanto per i formati audio che il
     browser non sa riprodurre (vedi apriDrive qui sopra). */

  /* Il riquadro con il messaggio e i due pulsanti di ripiego. */
  function notaHtml(titolo, testo, fileId, downloadUrl) {
    const apri = fileId ? 'https://drive.google.com/file/d/' + fileId + '/view' : (downloadUrl || '#');
    return '<div class="pdf-note"><strong>' + esc(titolo) + '</strong>' + esc(testo) +
      '<div class="pdf-actions">' +
        '<a href="' + esc(apri) + '" target="_blank" rel="noopener">' +
          icon('esterno') + 'Apri in Drive</a>' +
        (downloadUrl ? '<a class="ghost" href="' + esc(downloadUrl) + '" target="_blank" rel="noopener">' +
          icon('scarica') + 'Scarica</a>' : '') +
      '</div></div>';
  }

  /* Prepara la finestra: titolo e link di salvataggio. */
  function prontoPerAprire(title, downloadUrl) {
    document.getElementById('pdfTitle').textContent = title || '';
    document.getElementById('pdfDownload').href = downloadUrl || '#';
    document.getElementById('pdfFrame').hidden = true;
    document.getElementById('pdfFrame').src = '';
  }

  function closePdf() {
    document.getElementById('pdfViewer').hidden = true;
    document.getElementById('pdfStage').innerHTML = '';
    document.getElementById('pdfFrame').src = '';
    document.getElementById('pdfFrame').hidden = true;
    document.body.classList.remove('viewer-open');
  }


  /* ---------- PDF della scaletta ---------- */
  const JSPDF_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
  const ROSSO = [165, 37, 43];
  const ORO   = [176, 139, 51];
  let jsPdfLoader = null;

  function loadJsPdf() {
    if (jsPdfLoader) return jsPdfLoader;
    jsPdfLoader = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = JSPDF_URL;
      s.onload = () => {
        if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
        else reject(new Error('libreria non valida'));
      };
      s.onerror = () => { jsPdfLoader = null; reject(new Error('libreria non raggiungibile')); };
      document.head.appendChild(s);
    });
    return jsPdfLoader;
  }

  function nomeFile() {
    const base = (appData.liturgyTitle || 'scaletta')
      .replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, '');
    return 'Scaletta_' + (base || 'coro') + '.pdf';
  }

  async function downloadSetlistPdf() {
    if (!appData.setlist.length) return;
    const btn = document.getElementById('downloadSetlistBtn');
    const prima = btn.innerHTML;
    btn.textContent = 'Preparo il PDF…';
    btn.disabled = true;

    try {
      const JsPDF = await loadJsPdf();
      const doc = new JsPDF({ unit: 'mm', format: 'a4' });
      const W = 210, M = 20;
      let y = 28;

      doc.setFont('times', 'bold'); doc.setFontSize(19); doc.setTextColor(27, 26, 23);
      doc.text(appData.choirName || 'Coro', W / 2, y, { align: 'center' });
      y += 8;

      doc.setFont('times', 'normal'); doc.setFontSize(13); doc.setTextColor(85, 82, 75);
      doc.text(appData.liturgyTitle || '', W / 2, y, { align: 'center' });
      y += 6;

      doc.setDrawColor(ORO[0], ORO[1], ORO[2]); doc.setLineWidth(0.7);
      doc.line(W / 2 - 16, y, W / 2 + 16, y);
      y += 15;

      appData.setlist.forEach(item => {
        if (y > 256) { doc.addPage(); y = 28; }

        doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
        doc.setTextColor(ROSSO[0], ROSSO[1], ROSSO[2]);
        doc.text(item.momento.toUpperCase(), M, y, { charSpace: 0.5 });

        doc.setFont('times', 'bold'); doc.setFontSize(15); doc.setTextColor(27, 26, 23);
        const righe = doc.splitTextToSize(item.title, W - M * 2 - 32);
        doc.text(righe, M, y + 7.5);

        y += 7.5 + righe.length * 6.5 + 8;
        doc.setDrawColor(226, 223, 215); doc.setLineWidth(0.2);
        doc.line(M, y - 5, W - M, y - 5);
      });

      const pagine = doc.getNumberOfPages();
      for (let p = 1; p <= pagine; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
        doc.setTextColor(150, 146, 138);
        const oggi = new Date().toLocaleDateString('it-CH');
        doc.text('Generato il ' + oggi + (pagine > 1 ? '  ·  ' + p + '/' + pagine : ''),
                 W / 2, 288, { align: 'center' });
      }

      doc.save(nomeFile());
    } catch (err) {
      stampaScaletta();
    }

    btn.innerHTML = prima;
    btn.disabled = false;
  }

  /** Ripiego se la libreria non si carica: stampa del browser. */
  function stampaScaletta() {
    toast('Uso la stampa del browser: scegli "Salva come PDF".');
    const righe = appData.setlist.map(i =>
      '<tr><td class="m">' + esc(i.momento) + '</td><td>' + esc(i.title) +
      '</td></tr>').join('');
    const w = window.open('', '_blank');
    if (!w) { toast('Consenti le finestre pop-up per stampare.', 'error'); return; }
    w.document.write('<!doctype html><html lang="it"><head><meta charset="utf-8"><title>' +
      esc(nomeFile().replace(/\.pdf$/, '')) + '</title><style>' +
      'body{font-family:Georgia,serif;padding:34px;color:#1b1a17}' +
      'h1{font-size:21px;margin:0;text-align:center}' +
      'h2{font-size:14px;font-weight:400;color:#55524b;margin:6px 0 24px;text-align:center}' +
      'table{width:100%;border-collapse:collapse}' +
      'td{padding:12px 4px;border-bottom:1px solid #e2dfd7;font-size:15px;font-weight:700}' +
      'td.m{width:140px;font-family:Arial,sans-serif;font-size:9px;letter-spacing:.09em;' +
      'text-transform:uppercase;color:#a5252b}' +
      '</style></head><body><h1>' + esc(appData.choirName) + '</h1><h2>' +
      esc(appData.liturgyTitle) + '</h2><table>' + righe + '</table></body></html>');
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 500);
  }

  /* ---------- Azioni admin ---------- */
  async function login() {
    if (adminToken) {
      if (confirm("Vuoi uscire dalla modalità Admin?")) {
        adminToken = "";
        sessionStorage.removeItem('coroAdminPwd');
        setAdmin(false);
      }
      return;
    }
    const pwd = prompt("Password Admin:");
    if (!pwd) return;
    try {
      const res = await api('login', { pwd });
      if (res.success) {
        adminToken = pwd;
        sessionStorage.setItem('coroAdminPwd', pwd);
        setAdmin(true);
        toast("Modalità Admin attiva");
      } else {
        toast("Password errata", "error");
      }
    } catch (e) { toast("Errore di connessione", "error"); }
  }

  async function run(action, params, okMsg) {
    if (!adminToken) return;
    try {
      const res = await api(action, Object.assign({ pwd: adminToken }, params));
      if (res.success) { toast(okMsg || res.msg); await loadData(); }
      else { toast(res.msg || "Operazione non riuscita", "error"); }
    } catch (e) { toast("Errore di connessione", "error"); }
  }

  async function sync() {
    if (!adminToken) return;
    const btn = document.getElementById('syncBtn');
    const prima = btn.innerHTML;
    btn.textContent = 'Ricerca…';
    btn.disabled = true;
    try {
      const res = await api('sync', { pwd: adminToken });
      toast(res.msg, res.success ? null : 'error');
      if (res.success) await loadData();
    } catch (e) { toast("Errore di connessione", "error"); }
    btn.innerHTML = prima;
    btn.disabled = false;
  }

  function addToSetlist(songId, momento) { run('add', { songId, momento }); }
  function removeSong(momento) {
    if (confirm('Rimuovere il canto da "' + momento + '"?')) run('remove', { momento });
  }

  /* ---------- Avvio ---------- */
  paintIcons();

  document.getElementById('adminToggleBtn').addEventListener('click', login);
  document.getElementById('syncBtn').addEventListener('click', sync);
  document.getElementById('downloadSetlistBtn').addEventListener('click', downloadSetlistPdf);
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('searchAudioInput').addEventListener('input', applyAudioFilters);
  document.getElementById('pdfClose').addEventListener('click', closePdf);
  document.getElementById('pdfViewer').addEventListener('click', e => {
    if (e.target.id === 'pdfViewer') closePdf();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('pdfViewer').hidden) closePdf();
  });

  document.getElementById('editTitleBtn').addEventListener('click', () => {
    const current = document.getElementById('liturgyTitle').textContent;
    const value = prompt("Intestazione (data / orario):", current);
    if (value && value.trim()) run('title', { value: value.trim() });
  });
  document.getElementById('clearSetlistBtn').addEventListener('click', () => {
    if (confirm("Vuoi svuotare tutta la scaletta attiva?")) run('clear', {});
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  renderAudioTagFilters();
  if (adminToken) setAdmin(true);
  loadData();
  </script>
</body>
</html>
